[projects."/Users/ser/dev/literature-scout"]
trust_level = "trusted"

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"
"gpt-5.2-codex" = "gpt-5.4"

[features]
multi_agent = true
apps = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "git-branch",
  "five-hour-limit",
  "weekly-limit",
]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 1
gpt-6-astra = 3

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

[plugins."github@openai-curated"]
enabled = true
