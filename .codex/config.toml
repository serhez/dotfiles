[projects."/Users/ser/dev/value-bench"]
trust_level = "trusted"

[projects."/Users/ser/dev/inverse-strategy"]
trust_level = "trusted"

[projects."/Users/ser/Downloads/_NeurIPS_26__ValueBench (3)"]
trust_level = "trusted"

[projects."/Users/ser/dev/signal-bench"]
trust_level = "trusted"

