trust_level = "trusted"

[projects."/Users/ser/dev/bento.nvim"]
trust_level = "trusted"

[projects."/Users/ser/dev"]
trust_level = "trusted"

[projects."/Users/ser/.config/tmux"]
trust_level = "trusted"

[projects."/Users/ser"]
trust_level = "trusted"

[projects."/Users/ser/dev/overleaf.nvim"]
trust_level = "trusted"

